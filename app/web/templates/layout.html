<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QA AI Platform</title>
    <style>
        body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#111827}
        header{height:44px;background:#111827;color:white;position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 16px;box-sizing:border-box}
        header h1{font-size:17px;margin:0}
        .header-title{display:flex;align-items:center;gap:12px;min-width:0}
        .header-link{color:#dbeafe;text-decoration:none;font-size:13px;font-weight:bold;white-space:nowrap}
        .header-link:hover{color:white;text-decoration:underline}
        .header-controls{display:flex;align-items:center;gap:10px;min-width:0}
        .header-ai-mode{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
        .header-ai-mode select{font-size:12px;padding:4px 6px;border-radius:6px;border:1px solid #374151;background:#f9fafb;color:#111827;max-width:190px}
        .header-ai-status{font-size:11px;color:#d1d5db;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .header-test-button{background:#4b5563;color:white;border:1px solid #6b7280;border-radius:6px;padding:5px 9px;font-size:12px;white-space:nowrap}
        .llm-test-panel{display:none;position:fixed;top:48px;right:16px;width:min(760px,calc(100vw - 32px));max-height:420px;overflow:auto;background:white;color:#111827;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.22);z-index:1001;padding:12px;box-sizing:border-box}
        .llm-test-panel.visible{display:block}
        .llm-test-panel h3{margin:0 0 8px;font-size:14px;padding-right:28px}
        .llm-test-close{position:absolute;top:8px;right:8px;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:transparent;color:#374151;font-size:20px;line-height:22px;cursor:pointer}
        .llm-test-close:hover{background:#f3f4f6;color:#111827}
        .llm-test-message{font-size:12px;color:#4b5563;margin-bottom:8px}
        .llm-test-table{width:100%;border-collapse:collapse;font-size:12px}
        .llm-test-table th,.llm-test-table td{border-bottom:1px solid #e5e7eb;padding:7px;text-align:left;vertical-align:top}
        .llm-test-table th{background:#f3f4f6;color:#374151}
        .llm-status{display:inline-block;border-radius:999px;padding:3px 8px;font-weight:bold;font-size:11px}
        .llm-status.ok{background:#d1fae5;color:#065f46}
        .llm-status.failed{background:#fee2e2;color:#991b1b}
        .llm-status.skipped{background:#e5e7eb;color:#374151}
        .llm-status.disabled{background:#fef3c7;color:#92400e}
        main{padding:56px 12px 18px}
        .portal-layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:12px;align-items:start}
        .sidebar{position:sticky;top:56px;height:calc(100vh - 68px);overflow-y:auto;background:white;border:1px solid #e5e7eb;border-radius:10px;padding:10px;box-shadow:0 1px 5px rgba(0,0,0,.07);box-sizing:border-box}
        .content-area{min-width:0}
        .sidebar-back{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:#f3f4f6;color:#111827;text-decoration:none;font-size:21px;font-weight:bold;margin-bottom:8px}
        .side-title{font-size:12px;font-weight:bold;color:#6b7280;text-transform:uppercase;margin:12px 6px 5px}
        .side-tab,.side-link,.side-action{display:block;width:100%;box-sizing:border-box;border:0;background:transparent;text-align:left;text-decoration:none;color:#374151;padding:6px 8px;border-radius:6px;font-size:13px;line-height:16px;cursor:pointer}
        .side-tab{font-weight:bold}
        .side-tab.active{background:#2563eb;color:white}
        .side-link{font-size:12px;color:#4b5563;padding-left:14px}
        .side-action{padding-left:18px}
        .side-link:hover,.side-action:hover,.side-tab:hover{background:#f3f4f6;color:#111827}
        .side-tab.active:hover{background:#2563eb;color:white}
        .side-form{margin:0}
        details.side-details{margin-top:8px}
        details.side-details summary{cursor:pointer;font-size:12px;font-weight:bold;color:#6b7280;text-transform:uppercase;margin:8px 6px}
        .danger-link,.danger-action{color:#991b1b!important}
        .card{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,.06)}
        .section-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
        .section-header h3{margin:0}
        .section-block{border:1px solid #e5e7eb;border-radius:8px;background:#f9fafb;padding:12px;margin:10px 0}
        .section-title{font-weight:bold;margin-bottom:8px}
        input,textarea,select,button{font-size:14px}
        input,textarea{width:100%;box-sizing:border-box;margin:6px 0 12px;padding:9px}
        button,.button{background:#2563eb;color:white;border:0;border-radius:6px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block;line-height:18px;box-sizing:border-box;font-size:13px}
        .secondary{background:#4b5563!important}.success{background:#059669!important}.warning{background:#d97706!important}.danger{background:#dc2626!important}
        button:disabled{opacity:.6;cursor:not-allowed}
        pre{background:#111827;color:#e5e7eb;padding:12px;border-radius:8px;overflow:auto;max-height:520px;white-space:pre-wrap;font-size:12px}
        .status{display:inline-block;padding:3px 8px;border-radius:999px;background:#e5e7eb;margin:0 6px 6px 0;font-size:12px}
        .status.ok{background:#d1fae5;color:#065f46}.status.missing{background:#fee2e2;color:#991b1b}
        .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
        .metric-card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:12px}
        .metric-label{font-size:12px;color:#6b7280}.metric-value{font-size:22px;font-weight:bold}
        .visual-table{width:100%;border-collapse:collapse;font-size:13px}
        .visual-table th,.visual-table td{border-bottom:1px solid #e5e7eb;padding:8px;vertical-align:top;text-align:left}
        .visual-table th{background:#f3f4f6}
        .badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:12px;font-weight:bold;background:#e5e7eb}
        .badge.high{background:#fee2e2;color:#991b1b}.badge.medium{background:#fef3c7;color:#92400e}.badge.low{background:#d1fae5;color:#065f46}
        .info-list{margin:0;padding-left:18px}.info-list li{margin-bottom:5px}
        .question-card{border:1px solid #e5e7eb;border-left:4px solid #d97706;border-radius:8px;padding:12px;margin-bottom:10px;background:#fffbeb}
        .question-id{font-weight:bold;color:#92400e;margin-bottom:6px}
        .placeholder-box{border:1px dashed #9ca3af;background:#f9fafb;padding:14px;border-radius:8px;color:#374151}
        .version-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
        .version-toolbar form{display:flex;gap:8px;align-items:center;margin:0}.version-toolbar select{min-width:180px}
        .editor-textarea{min-height:360px;font-family:Consolas,monospace;font-size:12px;white-space:pre}
        .mini-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
        .ai-mode-panel{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:10px}
        .toggle-row{display:inline-flex;align-items:center;gap:8px;font-weight:bold}
        .toggle-row input{width:auto;margin:0}
        .ai-mode-status{margin-top:10px;padding:8px 10px;border-radius:8px;background:#eef2ff;color:#3730a3;font-size:13px}
        .loading-overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.72);z-index:9999;align-items:center;justify-content:center;color:white}
        .loading-box{background:#111827;padding:24px 32px;border-radius:12px;text-align:center;min-width:300px}
        .spinner{width:38px;height:38px;border:4px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;margin:0 auto 14px;animation:spin .9s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:900px){.portal-layout{grid-template-columns:1fr}.sidebar{position:relative;top:0;height:auto}}
    </style>
</head>
<body>
<header>
    <div class="header-title">
        <h1>QA AI Platform - Web Portal</h1>
        <a class="header-link" href="/portal">Requirements</a>
        <a class="header-link" href="/portal/chat">AI Chat</a>
        <a class="header-link" href="/portal/knowledge">Knowledge System</a>
        {% if knowledge_base_enabled is defined and knowledge_base_enabled() %}
        <a class="header-link" href="/portal/kb">Knowledge Base</a>
        {% endif %}
    </div>
    <div class="header-controls">
        <label class="header-ai-mode" for="portalAiModeSelect">
            AI Execution Mode:
            <select id="portalAiModeSelect">
                <option value="NO_LLM">No LLM</option>
                <option value="PRODUCTION_HYBRID_DEEPSEEK">Production Hybrid - DeepSeek</option>
                <option value="PRODUCTION_HYBRID_COPILOT">Production Hybrid - Copilot</option>
                <option value="DEEPSEEK_ONLY">DeepSeek Only</option>
                <option value="COPILOT_ONLY">Copilot Only</option>
                <option value="TEST_LOCAL_ONLY">Test Local Only</option>
            </select>
        </label>
        <button id="llmTestAllButton" class="header-test-button" type="button">Test All LLMs</button>
        <span id="portalAiModeStatus" class="header-ai-status"></span>
    </div>
</header>
<div id="llmTestPanel" class="llm-test-panel" aria-live="polite"></div>
<main>{% block content %}{% endblock %}</main>
<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
        <div class="spinner"></div>
        <div id="loadingTitle"><b>Processing...</b></div>
        <div id="loadingMessage">Please wait. This may take a few minutes.</div>
    </div>
</div>
<script>
const PORTAL_AI_MODE_KEY = "portal_ai_mode";
const PORTAL_DEFAULT_AI_MODE = "{{ portal_default_ai_mode|default('NO_LLM') }}";

function showLoading(title,message){
    document.getElementById("loadingTitle").innerHTML="<b>"+(title||"Processing...")+"</b>";
    document.getElementById("loadingMessage").textContent=message||"Please wait. This may take a few minutes.";
    document.getElementById("loadingOverlay").style.display="flex";
    document.querySelectorAll("button").forEach(b=>b.disabled=true);
}

function getPortalAiState() {
    const stored = localStorage.getItem(PORTAL_AI_MODE_KEY) || PORTAL_DEFAULT_AI_MODE || "NO_LLM";
    let aiMode = String(stored).trim().toUpperCase();
    if (aiMode === "PRODUCTION_HYBRID") {
        aiMode = "PRODUCTION_HYBRID_DEEPSEEK";
    }
    const validModes = [
        "NO_LLM",
        "PRODUCTION_HYBRID_DEEPSEEK",
        "PRODUCTION_HYBRID_COPILOT",
        "DEEPSEEK_ONLY",
        "COPILOT_ONLY",
        "TEST_LOCAL_ONLY",
    ];
    return {
        aiMode: validModes.includes(aiMode) ? aiMode : "NO_LLM",
    };
}

function getPortalAiStatusText(aiMode) {
    if (aiMode === "TEST_LOCAL_ONLY") {
        return "Test mode: all AI tasks use local providers only. Remote providers are OFF.";
    }
    if (aiMode === "PRODUCTION_HYBRID_DEEPSEEK") {
        return "Production hybrid: DeepSeek handles reasoning; local AI handles vision/compact/helper tasks.";
    }
    if (aiMode === "PRODUCTION_HYBRID_COPILOT") {
        return "Production hybrid: Copilot handles reasoning; local AI handles vision/compact/helper tasks.";
    }
    if (aiMode === "DEEPSEEK_ONLY") {
        return "DeepSeek only: all text reasoning uses DeepSeek. Local AI is OFF.";
    }
    if (aiMode === "COPILOT_ONLY") {
        return "Copilot only: all text reasoning uses Copilot. Local AI is OFF.";
    }
    return "This action requires LLM. Select an AI mode other than NO_LLM.";
}

function friendlyPortalError(message) {
    const text = String(message || "").trim();

    if (!text) {
        return "Request failed. Please try again.";
    }

    if (text.includes("Traceback") || text.includes("stack trace")) {
        return "The action failed. Check the latest job status or server logs for details.";
    }

    return text;
}

function savePortalAiState(aiMode) {
    localStorage.setItem(PORTAL_AI_MODE_KEY, aiMode);
    renderPortalAiModeControls();
}

function renderPortalAiModeControls() {
    const modeSelect = document.getElementById("portalAiModeSelect");
    const status = document.getElementById("portalAiModeStatus");
    const state = getPortalAiState();

    if (modeSelect) {
        modeSelect.value = state.aiMode;
    }

    if (status) {
        status.textContent = getPortalAiStatusText(state.aiMode);
    }

    document.querySelectorAll("form[data-ai-action='true'] button[type='submit']").forEach(button => {
        if (state.aiMode === "NO_LLM") {
            button.disabled = true;
            button.title = "This action requires LLM. Select an AI mode other than NO_LLM.";
        } else if (button.dataset.partialBlocked !== "true") {
            button.disabled = false;
            button.title = "";
        }
    });
}

function portalAiHeaders() {
    const state = getPortalAiState();
    return {
        "X-AI-Mode": state.aiMode,
    };
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function renderLlmTestResult(data) {
    const panel = document.getElementById("llmTestPanel");

    if (!panel) {
        return;
    }

    const rows = (data && data.results) || [];
    const body = rows.map(row => {
        const status = String(row.status || "FAILED").toUpperCase();
        const statusClass = status.toLowerCase();
        let message = row.error || row.message || "";
        if (row.provider === "LOCAL_VISION" && status === "OK") {
            message = "Model available. Vision inference not tested.";
        }
        return `
            <tr>
                <td>${escapeHtml(row.provider)}</td>
                <td>${escapeHtml(row.model)}</td>
                <td><span class="llm-status ${escapeHtml(statusClass)}">${escapeHtml(status)}</span></td>
                <td>${escapeHtml(row.duration_ms || 0)} ms</td>
                <td>${escapeHtml(message)}</td>
            </tr>
        `;
    }).join("");

    panel.innerHTML = `
        <button class="llm-test-close" type="button" aria-label="Close LLM health check">&times;</button>
        <h3>LLM Provider Health Check</h3>
        <div class="llm-test-message">
            Overall: ${data && data.ok ? "OK" : "Check failed"} · Duration: ${escapeHtml((data && data.duration_ms) || 0)} ms
        </div>
        <table class="llm-test-table">
            <thead>
                <tr>
                    <th>Provider</th>
                    <th>Model</th>
                    <th>Status</th>
                    <th>Response Time</th>
                    <th>Message / Error</th>
                </tr>
            </thead>
            <tbody>${body}</tbody>
        </table>
    `;
    panel.classList.add("visible");
}

function closeLlmTestPanel() {
    const panel = document.getElementById("llmTestPanel");

    if (panel) {
        panel.classList.remove("visible");
    }
}

function renderLlmTestFailure(message) {
    renderLlmTestResult({
        ok: false,
        duration_ms: 0,
        results: [
            {
                provider: "PORTAL",
                model: "",
                status: "FAILED",
                duration_ms: 0,
                error: friendlyPortalError(message),
            },
        ],
    });
}

async function testAllLlms() {
    const button = document.getElementById("llmTestAllButton");
    const panel = document.getElementById("llmTestPanel");

    if (button) {
        button.disabled = true;
        button.textContent = "Testing...";
    }

    if (panel) {
        panel.innerHTML = `
            <button class="llm-test-close" type="button" aria-label="Close LLM health check">&times;</button>
            <h3>LLM Provider Health Check</h3>
            <div class="llm-test-message">Testing all LLM providers...</div>
        `;
        panel.classList.add("visible");
    }

    try {
        const data = await portalFetch("/portal/llm/test-all", {
            method: "POST",
        });
        renderLlmTestResult(data);
    } catch (error) {
        renderLlmTestFailure(error.message);
    } finally {
        if (button) {
            button.disabled = false;
            button.textContent = "Test All LLMs";
        }
    }
}

async function parseFetchResponse(response) {
    const text = await response.text();
    let data = null;

    try {
        data = text ? JSON.parse(text) : null;
    } catch (_error) {
        data = null;
    }

    return { text, data };
}

async function portalFetch(url, options = {}) {
    const headers = new Headers(options.headers || {});
    const aiHeaders = portalAiHeaders();
    const returnResponse = Boolean(options.returnResponse);

    Object.keys(aiHeaders).forEach(key => headers.set(key, aiHeaders[key]));

    const fetchOptions = {...options};
    delete fetchOptions.returnResponse;

    const response = await fetch(url, {
        ...fetchOptions,
        headers,
    });

    const { text, data } = await parseFetchResponse(response);

    if (!response.ok) {
        const message =
            (data && (data.detail || data.error || data.message)) ||
            text ||
            response.statusText ||
            `HTTP ${response.status}`;
        throw new Error(friendlyPortalError(message));
    }

    if (returnResponse) {
        return { response, data, text };
    }

    return data ?? text;
}

async function submitPortalFormWithAiHeaders(form) {
    const method = (form.getAttribute("method") || "get").toUpperCase();
    const action = form.getAttribute("action") || window.location.href;
    const formData = new FormData(form);

    showLoading(
        form.getAttribute("data-loading-title"),
        form.getAttribute("data-loading-message")
    );

    const result = await portalFetch(action, {
        method,
        body: method === "GET" ? undefined : formData,
        redirect: "follow",
        returnResponse: true,
    });

    window.location.href = result.response.url || window.location.href;
}

window.portalFetch = portalFetch;
window.submitPortalFormWithAiHeaders = submitPortalFormWithAiHeaders;

document.addEventListener("DOMContentLoaded",()=>{
    renderPortalAiModeControls();

    const modeSelect = document.getElementById("portalAiModeSelect");

    if (modeSelect) {
        modeSelect.addEventListener("change", () => {
            savePortalAiState(modeSelect.value);
        });
    }

    const llmTestAllButton = document.getElementById("llmTestAllButton");
    const llmTestPanel = document.getElementById("llmTestPanel");

    if (llmTestAllButton) {
        llmTestAllButton.addEventListener("click", () => {
            testAllLlms();
        });
    }

    if (llmTestPanel) {
        llmTestPanel.addEventListener("click", event => {
            if (event.target.closest(".llm-test-close")) {
                closeLlmTestPanel();
            }
        });
    }

    document.addEventListener("click", event => {
        const panel = document.getElementById("llmTestPanel");
        const button = document.getElementById("llmTestAllButton");

        if (!panel || !panel.classList.contains("visible")) {
            return;
        }

        if (panel.contains(event.target) || (button && button.contains(event.target))) {
            return;
        }

        closeLlmTestPanel();
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
            closeLlmTestPanel();
        }
    });

    document.querySelectorAll("form[data-ai-action='true']").forEach(form=>{
        form.addEventListener("submit",async event=>{
            event.preventDefault();
            event.stopImmediatePropagation();
            try {
                await submitPortalFormWithAiHeaders(form);
            } catch (error) {
                alert(error.message);
                window.location.reload();
            }
        });
    });

    document.querySelectorAll("form[data-loading='true']").forEach(form=>{
        form.addEventListener("submit",()=>{
            showLoading(form.getAttribute("data-loading-title"),form.getAttribute("data-loading-message"));
        });
    });
});
</script>
</body>
</html>
